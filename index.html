<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14161f">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="فتيل · Fuse Crew — لعبة تعاونية لتلات لاعبين: أعمى وأطرش وأخرس لازم يفكوا القنبلة سوا.">
  <title>فتيل · Fuse Crew</title>
  <script>
    /* apply the saved (or the system) theme before the first paint, so there is no dark/light flash */
    (function () {
      try {
        var t = localStorage.getItem('fuse-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f4f1ec' : '#14161f');
      } catch (e) { /* default: dark */ }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="فتيل">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/cairo-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
